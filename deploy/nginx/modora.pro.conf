server {
    listen 80;
    listen [::]:80;
    server_name www.modora.pro;
    return 301 https://modora.pro$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name modora.pro;
    return 301 https://modora.pro$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.modora.pro;
    return 301 https://api.modora.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.modora.pro;

    ssl_certificate /etc/ssl/certs/modora.pro-origin.crt;
    ssl_certificate_key /etc/ssl/private/modora.pro-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://modora.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modora.pro;

    ssl_certificate /etc/ssl/certs/modora.pro-origin.crt;
    ssl_certificate_key /etc/ssl/private/modora.pro-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/modora-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /demo {
        return 301 /demo/;
    }

    location /demo/ {
        alias /var/www/modora-demo/;
        try_files $uri $uri/ /demo/index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.modora.pro;

    ssl_certificate /etc/ssl/certs/modora.pro-origin.crt;
    ssl_certificate_key /etc/ssl/private/modora.pro-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 100m;

    location = / {
        default_type text/plain;
        return 200 "MoDora API endpoint.\nUse /health or /api/*.\n";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8005/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
